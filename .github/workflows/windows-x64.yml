name: windows-x64

on:
  push:
    branches: [devin/1790861083-windows-x64-devbox]
  workflow_dispatch:
    inputs:
      session_id:
        description: "DevBox session id for a live gateway smoke (optional)"
        required: false

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap:win
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-package
          path: "dist/Grok Bot 0.18 Reconstructed-win32-x64/reconstructed-package.json"
      - name: DevBox gateway smoke
        if: github.event_name == 'workflow_dispatch' && inputs.session_id != ''
        env:
          DEVBOX_SESSION_ID: ${{ inputs.session_id }}
          DEVBOX_API_KEY: ${{ secrets.DEVBOX_API_KEY }}
        run: node scripts/ci/devbox-gateway-smoke.mjs gateway-smoke.json
      - name: DevBox backend smoke (plugin/bot)
        if: github.event_name == 'workflow_dispatch' && inputs.session_id != ''
        env:
          DEVBOX_API_KEY: ${{ secrets.DEVBOX_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/devbox-bot
        run: node scripts/ci/devbox-backend-smoke.mjs backend-smoke.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Launch smoke (CDP screenshot)
        shell: pwsh
        run: |
          $exe = "dist/Grok Bot 0.18 Reconstructed-win32-x64/Grok Bot.exe"
          # SAND_HOST_GATEWAY_* comes from GITHUB_ENV when the gateway
          # smoke step ran; otherwise unset (local/offline launch).
          $proc = Start-Process -FilePath $exe -ArgumentList "--remote-debugging-port=9229" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                Invoke-RestMethod http://127.0.0.1:9229/json/version | Out-Null
                $ready = $true; break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Grok Bot.exe did not open a CDP endpoint" }
            node scripts/ci/cdp-screenshot.mjs 9229 window.png window.json
            if ($env:SAND_HOST_GATEWAY_URL) {
              Start-Sleep -Seconds 20
              node scripts/ci/cdp-screenshot.mjs 9229 window-connected.png window-connected.json
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-screenshot
          path: |
            window.png
            window.json
            window-connected.png
            window-connected.json
            gateway-smoke.json
            backend-smoke.json
